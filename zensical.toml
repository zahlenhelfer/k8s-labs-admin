[project]
site_name = "k8s Labs for Admins"
site_url = "https://zahlenhelfer.github.io/k8s-labs-admin/"
site_description = "Hands-on Kubernetes labs for cluster administrators"
repo_url = "https://github.com/zahlenhelfer/k8s-labs-admin"
repo_name = "zahlenhelfer/k8s-labs-admin"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

[project.theme]
variant = "classic"
language = "en"
logo = "img/k8s_logo.svg"
features = [
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.action.edit",
  "navigation.tracking",
  "navigation.instant",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.awesome-nav]

[project.plugins.minify]
minify_html = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
def_list = {}
footnotes = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
